<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Tools</title>
		<meta name="viewport" content="width=800">
		<meta content="text/html; charset=utf-8" http-equiv="Content-Type">
		<link rel="stylesheet" href="css/tabs.css">
		<script src="js/utils.js"></script>
		<script src="js/tabs.js"></script>
		<style>
* {
  font-family: Arial;
  color: white;
}
html { 
  background-color: rgb(40, 41, 43);
}
textarea {
  font-family: monospaced;
  border-color: rgb(62, 68, 70);
  background-color: rgb(34, 36, 38);
  width: 100%;
  resize: vertical;
  white-space: break-spaces;
  word-break: break-all;
  box-sizing: border-box;
  min-height: 220px;
}
input:focus {
  outline: none !important;
}
textarea:focus { 
  outline: none !important;
}
.smalltext {
  min-height: 20px;
}
		</style>
	</head>
	<body>
		<div id="tab-bar" class="tab">
		  <button class="tablinks" onclick="openTab(event, 'base64')">Base64</button>
		  <button class="tablinks" onclick="openTab(event, 'sortlines')">Sort Lines</button>
		  <button class="tablinks" onclick="openTab(event, 'dedupelines')">Remove Duplicate Lines</button>
		  <button class="tablinks" onclick="openTab(event, 'numconvert')">Num Converter</button>
		  <button class="tablinks" onclick="openTab(event, 'xorstr')">XOR Strings</button>
		  <button class="tablinks" onclick="openTab(event, 'json-pretty')">Prettify: JSON</button>
		  <button class="tablinks" onclick="openTab(event, 'xml-pretty')">Prettify: XML</button>
		</div>
<div id="base64" class="tabcontent">
  <h3>Cleartext</h3>
  <textarea id="b64in" placeholder="<Type/paste input text here>" spellcheck="false"></textarea>
  <h3>Base64</h3>
  <textarea id="b64out" placeholder="<Type/paste base64 text here>" spellcheck="false"></textarea>
  <script>(function() {
  var input = document.getElementById('b64in');
  var output = document.getElementById('b64out');
  input.addEventListener('input', () => {
    output.value = btoa(input.value);
  });
  output.addEventListener('input', () => {
    try {
	  input.value = atob(output.value);
	  output.style.borderColor = 'rgb(62, 68, 70)';
	} catch (e) {
	  output.style.borderColor = 'red';
	}
  })
  })();</script>
</div>
<div id="sortlines" class="tabcontent">
  <h3>Input</h3>
  <textarea id="sort_in" placeholder="<Unsorted lines go here>" spellcheck="false"></textarea>
  <h3>Sorted</h3>
  <textarea id="sort_out" placeholder="<Sorted lines appear here>" spellcheck="false"></textarea>
  <script>(function() {
  var input = document.getElementById('sort_in');
  var output = document.getElementById('sort_out');
  input.addEventListener('input', () => {
    var lines = input.value.split(/\r?\n/);
	lines.sort();
    output.value = lines.join('\n');
  });
  })();</script>
</div>
<div id="dedupelines" class="tabcontent">
  <h3>Input</h3>
  <textarea id="dedupe_in" placeholder="<Lines go here>" spellcheck="false"></textarea>
  <h3>Sorted</h3>
  <textarea id="dedupe_out" placeholder="<Lines without duplicates here>" spellcheck="false"></textarea>
  <script>(function() {
  var input = document.getElementById('dedupe_in');
  var output = document.getElementById('dedupe_out');
  input.addEventListener('input', () => {
    var lines = input.value.split(/\r?\n/);
	var dedupe = [...new Set(lines)];
    output.value = dedupe.join('\n');
  });
  })();</script>
</div>
<div id="numconvert" class="tabcontent">
  <h3>Base 10: Decimal</h3>
  <textarea class="smalltext" id="num10" placeholder="<Decimal number goes here>" spellcheck="false" onkeyup="this.value = this.value.replace(/[^0-9-]+|(?<=-|\w)-/g, '')"></textarea>
  <h3>Base 16: Hexadecimal</h3>
  <textarea class="smalltext" id="num16" placeholder="<Hex number goes here>" spellcheck="false" onkeyup="this.value = this.value.replace(/[^0-9-a-fA-F]+|(?<=-|\w)-/g, '')"></textarea>
  <h3>Base 2: Binary</h3>
  <p><input type="checkbox" id="twoscompl"> Interpret input as two's complement</p>
  <textarea class="smalltext" id="num2" placeholder="<Binary number goes here>" spellcheck="false" onkeyup="this.value = this.value.replace(/[^01-]+|(?<=-|\w)-/g, '')"></textarea>
  <script>(function() {
  var in2 = document.getElementById('num2');
  var in10 = document.getElementById('num10');
  var in16 = document.getElementById('num16');
  var twosComplement = document.getElementById('twoscompl');
  in10.addEventListener('input', () => {
	try {
	  var s = in10.value;
	  var n = Number(s) >>> 0;
	  in2.value =  n.toString(2);
	  in16.value = n.toString(16);
	  in10.style.borderColor = 'rgb(62, 68, 70)';
	} catch (e) {
	  in10.style.borderColor = 'red';
	}
  });
  in16.addEventListener('input', () => {
	try {
	  var s = in16.value;
	  var decimal = parseInt(s, 16);
	  var n = Number(decimal);
	  in2.value = n.toString(2);
	  in10.value = decimal;
	  in16.style.borderColor = 'rgb(62, 68, 70)';
	} catch (e) {
	  in16.style.borderColor = 'red';
	}
  });
  in2.addEventListener('input', () => {
	try {
	  var s = in2.value;
	  var decimal = parseInt(s, 2);
	  if (twosComplement.checked && s.length > 0 && s[0] == '1') {
	    var inverse = '';
        for (let i = 0; i < s.length; i++) {
            inverse += (s[i] === '0' ? '1' : '0');
        }
	    decimal = (parseInt(inverse, 2) + 1) * -1;
	  }
	  var n = Number(decimal);
	  in16.value = n.toString(16);
	  in10.value = decimal;
	  in2.style.borderColor = 'rgb(62, 68, 70)';
	} catch (e) {
	  in2.style.borderColor = 'red';
	}
  });
  })();</script>
</div>
<div id="xorstr" class="tabcontent">
  <h3>XOR: Input</h3>
  <textarea class="smalltext" id="xorin" placeholder="xor input string" spellcheck="false"></textarea>
  <h3>XOR: Output</h3>
  <textarea class="smalltext" id="xorout" placeholder="xor output string" spellcheck="false" readonly></textarea>
  <h3>XOR: Key</h3>
  <textarea class="smalltext" id="xorkey" placeholder="xor key (binary number)" spellcheck="false" onkeyup="this.value = this.value.replace(/[^01-]+|(?<=-|\w)-/g, '')">1</textarea>
  <script>(function() {
  var xorin = document.getElementById('xorin');
  var xorout = document.getElementById('xorout');
  var xorkey = document.getElementById('xorkey');
  function update() {
	try {
	  var output = "";
	  var input = xorin.value;
	  var key = parseInt(xorkey.value, 2 );
	  
      for (let i = 0; i < input.length; i++) {
        output += String.fromCharCode(input.charCodeAt(i) ^ key);
      }
	  
	  xorout.value = output;
	} catch (e) {
	  xorin.style.borderColor = 'red';
	}
  }
  xorin.addEventListener('input', () => { update(); });
  xorkey.addEventListener('input', () => { update(); });
  })();</script>
</div>
<div id="json-pretty" class="tabcontent">
  <h3>Input</h3>
  <textarea id="json_in" placeholder="<ugly json here>" spellcheck="false"></textarea>
  <h3>Pretty</h3>
  <textarea id="json_out" placeholder="<pretty json output>" spellcheck="false"></textarea>
  <script>(function() {
  var input = document.getElementById('json_in');
  var output = document.getElementById('json_out');
  input.addEventListener('input', () => {
    var spaces = 2;
	var json = input.value;
    output.value = JSON.stringify(JSON.parse(json), null, spaces);
  });
  })();</script>
</div>
<div id="xml-pretty" class="tabcontent">
  <h3>Input</h3>
  <textarea id="xml_in" placeholder="<ugly xml here>" spellcheck="false"></textarea>
  <h3>Pretty</h3>
  <textarea id="xml_out" placeholder="<pretty xml output>" spellcheck="false"></textarea>
  <script>
  function prettyPrintXml(xml, indentSize = 2) {
    const indentUnit =
      typeof indentSize === "number" ? " ".repeat(indentSize) : String(indentSize);
  
    const compact = xml.replace(/>\s+</g, "><").trim();
  
    const tokens = compact.match(
      /<\?[\s\S]*?\?>|<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<[^>]+>|[^<]+/g
    );
  
    if (!tokens) return "";
  
    let depth = 0;
    const lines = [];
  
    function isOpeningTag(token) {
      return (
        token.startsWith("<") &&
        !token.startsWith("</") &&
        !token.startsWith("<\?") &&
        !token.startsWith("<!--") &&
        !token.startsWith("<![CDATA[") &&
        !token.startsWith("<!DOCTYPE") &&
        !token.endsWith("/>")
      );
    }
  
    function isClosingTag(token) {
      return token.startsWith("</");
    }
  
    function isSpecialTag(token) {
      return (
        token.startsWith("<\?") ||
        token.startsWith("<!--") ||
        token.startsWith("<![CDATA[") ||
        token.startsWith("<!DOCTYPE")
      );
    }
  
    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i].trim();
      if (!token) continue;
  
      const next = tokens[i + 1]?.trim();
      const afterNext = tokens[i + 2]?.trim();
  
      // Keep <tag>text</tag> on one line.
      if (
        isOpeningTag(token) &&
        next &&
        afterNext &&
        !next.startsWith("<") &&
        isClosingTag(afterNext)
      ) {
        lines.push(indentUnit.repeat(depth) + token + next + afterNext);
        i += 2;
        continue;
      }
  
      if (isClosingTag(token)) {
        depth = Math.max(depth - 1, 0);
        lines.push(indentUnit.repeat(depth) + token);
        continue;
      }
  
      lines.push(indentUnit.repeat(depth) + token);
  
      if (isOpeningTag(token) && !isSpecialTag(token)) {
        depth++;
      }
    }
  
    return lines.join("\n");
  }
  
  (function() {
  var input = document.getElementById('xml_in');
  var output = document.getElementById('xml_out');
  input.addEventListener('input', () => {
	var xml = input.value;
    output.value = prettyPrintXml(xml);
  });
  })();</script>
</div>

	</body>
	<script>
	    // Open first tab by default
		document.getElementsByTagName('button')[0].click()
	</script>
</html>
